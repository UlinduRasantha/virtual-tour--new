<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image-inspired sample office</title><style>body{margin:0;background:#ddd8cb;font-family:Arial,sans-serif}canvas{display:block}aside{position:fixed;left:28px;bottom:25px;background:#142123e8;color:#f1f1e9;padding:15px 20px;border:1px solid #ffffff30;border-radius:8px;pointer-events:none}strong{font-size:12px;letter-spacing:2px}p{font-size:11px;margin:7px 0 0;color:#bac7c6}#preview-status{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 64px));padding:28px;background:#142123;color:#f1f1e9;border-radius:12px;box-shadow:0 15px 70px #0003}#preview-status h1{font-size:23px;margin:0 0 14px}#preview-status p{font-size:14px;line-height:1.6}#preview-status a{display:inline-block;margin-top:16px;background:#38bdf8;color:#10212a;padding:13px 18px;border-radius:7px;text-decoration:none;font-weight:bold}#preview-status code{color:#e0e8df}#preview-status[hidden]{display:none}</style></head><body><aside><strong>SAMPLE OFFICE / IMAGE STUDY</strong><p>Image-inspired approximation · not a LiDAR scan · dimensions assumed</p><p><a href="/?mode=sample" style="pointer-events:auto;color:#7dd3fc;font-size:14px;display:inline-block;padding:10px 0">Walk through this office · WASD + mouse →</a></p></aside><section id="preview-status" role="status"><h1 id="status-title">Loading sample office…</h1><p id="status-detail">Preparing the 3D scene.</p><a id="server-link" href="http://127.0.0.1:5173/tools/sample-office-preview.html" hidden>Open local preview →</a></section>
<script>
(function () {
  const status = document.getElementById('preview-status');
  const title = document.getElementById('status-title');
  const detail = document.getElementById('status-detail');
  if (location.protocol === 'file:') {
    title.textContent = 'Open this preview through the local server';
    detail.innerHTML = 'This file uses modules that need Vite. In the project folder, run <code>npm run dev</code>, leave it running, then open the link below. If Vite prints a different port, use that port instead.';
    document.getElementById('server-link').hidden = false;
    return;
  }
  function failed() {
    if (window.sampleReady) return;
    status.hidden = false;
    title.textContent = 'The 3D preview could not load';
    detail.textContent = 'Make sure the Vite server is running, refresh this page, and check that hardware acceleration is enabled in your browser.';
  }
  window.addEventListener('error', failed, true);
  window.addEventListener('unhandledrejection', failed);
  setTimeout(function () { if (!window.sampleReady) failed(); }, 20000);
}());
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildSampleOffice } from './sample-office-scene.js';
const { root, colliders } = buildSampleOffice();
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e7e4d8'); scene.add(root);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 150);
camera.position.set(4.95, 2.2, 7.05); camera.lookAt(-0.3, 1.45, -2.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1.5);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1; document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight('#eef3f0', '#82796a', 1.5));
const sun = new THREE.DirectionalLight('#fff1d7', 3.8); sun.position.set(-10, 5, 6); sun.target.position.set(1, 0, -2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 0.1, far: 40 }); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.025; scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight('#fff9ed', 0.6); fill.position.set(4, 2.8, 6); scene.add(fill);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(-0.3, 1.45, -2.5); controls.update();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.sampleOffice = {
  colliders,
  export: async () => {
    const buffer = await new GLTFExporter().parseAsync(root, { binary: true, onlyVisible: true, maxTextureSize: 1024 });
    const bytes = new Uint8Array(buffer); let binary = ''; for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
    return btoa(binary);
  },
  loadExport: async () => {
    const gltf = await new GLTFLoader().loadAsync('/models/office.glb'); scene.remove(root); scene.add(gltf.scene);
    let meshes = 0, triangles = 0; gltf.scene.traverse(o => { if (o.isMesh) { meshes++; triangles += (o.geometry.index?.count || o.geometry.attributes.position.count) / 3; o.castShadow = !o.material.transparent; o.receiveShadow = true; } });
    const bounds = new THREE.Box3().setFromObject(gltf.scene);
    renderer.render(scene, camera);
    return { meshes, triangles, bounds: { min: bounds.min.toArray(), max: bounds.max.toArray() }, animations: gltf.animations.length };
  },
  view: (name) => { if (name === 'wide') { camera.position.set(5.65, 2.85, 7.1); controls.target.set(-0.6, 1.4, -1); } else { camera.position.set(3.9, 1.7, 3.6); controls.target.set(-0.4, 1.5, -4.6); } controls.update(); renderer.render(scene, camera); },
};
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.sampleReady = true;
document.getElementById('preview-status').hidden = true;
</script></body></html>
